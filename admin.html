<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopNest — Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #c8956c;
      --accent-dark:  #a8714a;
      --danger:       #e05c5c;
      --muted:        #9e8e82;
      --border:       #e2d9d0;
      --warm-white:   #fdf9f6;
      --radius:       14px;
      --radius-sm:    8px;
      --transition:   .18s ease;
      --shadow:       0 4px 24px rgba(0,0,0,.08);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5efe9;
      color: #3a2e28;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 860px; margin: 0 auto; padding: .9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { font-size: 1.35rem; font-weight: 800; color: #3a2e28; text-decoration: none; letter-spacing: -.5px; }
    .nav-brand span { color: var(--accent); }
    .nav-links { list-style: none; display: flex; gap: 1.4rem; }
    .nav-links a { text-decoration: none; color: var(--muted); font-size: .93rem; font-weight: 500; transition: color var(--transition); }
    .nav-links a:hover, .nav-links a.active { color: var(--accent-dark); }

    /* LAYOUT */
    .admin-wrapper { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    .admin-title { font-size: 1.7rem; font-weight: 800; letter-spacing: -.4px; }
    .admin-subtitle { color: var(--muted); margin: .35rem 0 2rem; font-size: .95rem; }

    /* CARD */
    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.4rem; display: flex; align-items: center; gap: .5rem; color: #3a2e28; }

    /* FORM */
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .42rem; color: #5a4a42; }
    .form-group input,
    .form-group textarea {
      width: 100%; padding: .7rem .9rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: .95rem; background: var(--warm-white); color: #3a2e28;
      transition: border-color var(--transition), box-shadow var(--transition); outline: none; font-family: inherit;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,149,108,.15); }
    .form-group textarea { resize: vertical; min-height: 80px; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: .45rem; padding: .72rem 1.4rem; border-radius: var(--radius-sm); font-size: .92rem; font-weight: 600; cursor: pointer; border: none; transition: background var(--transition), opacity var(--transition); }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
    .btn-primary:disabled { opacity: .65; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: #5a4a42; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent-dark); }
    .btn-google { width: 100%; justify-content: center; background: #fff; border: 1.5px solid var(--border); color: #3a2e28; margin-top: .5rem; }
    .btn-google:hover { background: var(--warm-white); border-color: #bbb; }
    .btn-danger { background: transparent; border: 1.5px solid #e8c5c5; color: var(--danger); padding: .4rem .85rem; font-size: .82rem; border-radius: 6px; }
    .btn-danger:hover { background: rgba(224,92,92,.08); }
    .btn-group { display: flex; gap: .75rem; margin-top: 1.1rem; }
    .btn-group .btn { flex: 1; justify-content: center; }

    /* TABS */
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.4rem; }
    .auth-tab { flex: 1; padding: .6rem; background: none; border: none; font-size: .92rem; font-weight: 600; cursor: pointer; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; transition: color var(--transition), border-color var(--transition); }
    .auth-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); }

    /* DIVIDER */
    .divider { display: flex; align-items: center; gap: .75rem; color: var(--muted); font-size: .82rem; margin: 1rem 0 .5rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* USER BADGE */
    .user-badge { display: flex; align-items: center; gap: .5rem; font-size: .88rem; font-weight: 600; color: #5a4a42; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #5cb85c; flex-shrink: 0; }

    /* UPLOAD ZONE */
    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--radius-sm);
      background: var(--warm-white); padding: 1.8rem 1rem; text-align: center;
      cursor: pointer; transition: border-color var(--transition), background var(--transition); position: relative;
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(200,149,108,.05); }
    .upload-zone p { font-size: .9rem; color: var(--muted); margin: .4rem 0 0; }
    .upload-zone span { font-size: .78rem; color: var(--muted); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

    /* IMAGE PREVIEW */
    .image-preview-wrap { display: none; align-items: center; gap: 1rem; margin-top: .75rem; padding: .75rem; background: var(--warm-white); border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .image-preview-wrap.visible { display: flex; }
    .image-preview-wrap img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .image-preview-info { flex: 1; min-width: 0; }
    .image-preview-name { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .image-preview-size { font-size: .78rem; color: var(--muted); }
    .btn-remove-img { background: none; border: none; cursor: pointer; color: var(--danger); padding: .3rem; border-radius: 4px; }
    .btn-remove-img:hover { background: rgba(224,92,92,.1); }

    /* ADMIN PRODUCT LIST */
    .admin-product-item { display: flex; align-items: center; gap: .9rem; padding: .85rem 0; border-bottom: 1px solid var(--border); }
    .admin-product-item:last-child { border-bottom: none; }
    .admin-product-img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
    .admin-product-info { flex: 1; min-width: 0; }
    .admin-product-name { font-weight: 700; font-size: .93rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-product-desc { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .15rem; }
    .admin-product-price { font-size: .85rem; font-weight: 600; color: var(--accent-dark); margin-top: .2rem; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      padding: .75rem 1.4rem; border-radius: 10px; font-size: .9rem; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.15); z-index: 9999; white-space: nowrap;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .toast.success { background: #e8f8ee; color: #2a7a3a; border: 1px solid #b8dfc4; }
    .toast.error   { background: #fdeaea; color: #c03030; border: 1px solid #f0b8b8; }
    .toast.info    { background: #fff8ec; color: #7a5a1a; border: 1px solid #f0dcb0; }

    /* SPINNER */
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ERROR MSG */
    .err-msg { font-size: .82rem; color: var(--danger); margin-top: .35rem; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getDatabase, ref, push, remove, onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    /* ── Firebase Config ── */
    const app = initializeApp({
      apiKey:            "AIzaSyAY8JRgXXlO5Mutb0otOkwv7yZFTyn1t6E",
      authDomain:        "ecommerce-web-73dbf.firebaseapp.com",
      databaseURL:       "https://ecommerce-web-73dbf-default-rtdb.firebaseio.com",
      projectId:         "ecommerce-web-73dbf",
      storageBucket:     "ecommerce-web-73dbf.firebasestorage.app",
      messagingSenderId: "234407828753",
      appId:             "1:234407828753:web:365b2cc62ae9db992f00b0"
    });

    const auth     = getAuth(app);
    const db       = getDatabase(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' }); // always show account chooser

    let selectedFile    = null;
    let listenerStarted = false;

    /* ── Helpers ── */
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg, type = 'info') {
      const old = document.getElementById('__toast__');
      if (old) old.remove();
      const t = Object.assign(document.createElement('div'), { id: '__toast__', textContent: msg });
      t.className = 'toast ' + type;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function showAuthError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function clearAuthError() {
      document.getElementById('auth-error').classList.add('hidden');
    }

    function friendlyError(code) {
      const map = {
        'auth/invalid-email':          'Invalid email address.',
        'auth/user-not-found':         'No account found with this email.',
        'auth/wrong-password':         'Incorrect password.',
        'auth/email-already-in-use':   'This email is already registered.',
        'auth/weak-password':          'Password must be at least 6 characters.',
        'auth/too-many-requests':      'Too many attempts. Please try again later.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/invalid-credential':     'Invalid email or password.',
        'auth/popup-blocked':          'Popup was blocked. Please allow popups for this site and try again.',
        'auth/popup-closed-by-user':   'Sign-in popup was closed before completing.',
        'auth/cancelled-popup-request':'Only one popup allowed at a time.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    function formatBytes(b) {
      if (b < 1024)    return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    /* ── Image compression ── */
    function compressImage(file, maxWidth = 500, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Failed to read image file.'));
        reader.onload = e => {
          const img = new Image();
          img.onerror = () => reject(new Error('Failed to load image.'));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* ════════════════════════════════
       TAB SWITCHER
    ════════════════════════════════ */
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-signup').classList.toggle('active', !isLogin);
      document.getElementById('btn-login').style.display  = isLogin ? 'flex' : 'none';
      document.getElementById('btn-signup').style.display = isLogin ? 'none' : 'flex';
      clearAuthError();
    }
    document.getElementById('tab-login').addEventListener('click',  () => switchTab('login'));
    document.getElementById('tab-signup').addEventListener('click', () => switchTab('signup'));

    /* ════════════════════════════════
       LOGIN
    ════════════════════════════════ */
    document.getElementById('btn-login').addEventListener('click', async () => {
      clearAuthError();
      const email = document.getElementById('auth-email').value.trim();
      const pass  = document.getElementById('auth-password').value;
      if (!email || !pass) { showAuthError('Please enter your email and password.'); return; }
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showToast('Logged in successfully!', 'success');
      } catch (err) {
        showAuthError(friendlyError(err.code));
      } finally {
        btn.disabled = false; btn.textContent = 'Login';
      }
    });

    /* ════════════════════════════════
       SIGN UP
    ════════════════════════════════ */
    document.getElementById('btn-signup').addEventListener('click', async () => {
      clearAuthError();
      const email = document.getElementById('auth-email').value.trim();
      const pass  = document.getElementById('auth-password').value;
      if (!email || !pass) { showAuthError('Please enter your email and password.'); return; }
      if (pass.length < 6) { showAuthError('Password must be at least 6 characters.'); return; }
      const btn = document.getElementById('btn-signup');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        showToast('Account created! Welcome aboard.', 'success');
      } catch (err) {
        showAuthError(friendlyError(err.code));
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });

    /* ════════════════════════════════
       GOOGLE SIGN-IN
       — Must be triggered directly by user click (no async gap before signInWithPopup)
    ════════════════════════════════ */
    document.getElementById('btn-google').addEventListener('click', () => {
      clearAuthError();
      signInWithPopup(auth, provider)
        .then(() => showToast('Signed in with Google!', 'success'))
        .catch(err => {
          if (err.code !== 'auth/popup-closed-by-user' &&
              err.code !== 'auth/cancelled-popup-request') {
            showAuthError(friendlyError(err.code));
          }
        });
    });

    /* ════════════════════════════════
       LOGOUT
    ════════════════════════════════ */
    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth)
        .then(() => showToast('Logged out.', 'info'))
        .catch(() => showToast('Logout failed.', 'error'));
    });

    /* ════════════════════════════════
       FILE SELECT & PREVIEW
    ════════════════════════════════ */
    const fileInput   = document.getElementById('product-image-file');
    const uploadZone  = document.getElementById('upload-zone');
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg  = document.getElementById('preview-img');
    const previewName = document.getElementById('preview-name');
    const previewSize = document.getElementById('preview-size');

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFileSelect(fileInput.files[0]);
    });

    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.style.borderColor = 'var(--accent)';
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.style.borderColor = '';
    });
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.style.borderColor = '';
      if (e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
    });

    function handleFileSelect(file) {
      if (!file.type.startsWith('image/')) {
        showToast('Please select an image file (PNG, JPG, WEBP).', 'error'); return;
      }
      // Allow up to 5MB before compression
      if (file.size > 5 * 1024 * 1024) {
        showToast('Image must be under 5MB.', 'error'); return;
      }
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewName.textContent = file.name;
        previewSize.textContent = formatBytes(file.size);
        previewWrap.classList.add('visible');
        uploadZone.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('btn-remove-img').addEventListener('click', () => {
      selectedFile = null;
      previewImg.src = '';
      previewWrap.classList.remove('visible');
      uploadZone.style.display = '';
      fileInput.value = '';
    });

    /* ════════════════════════════════
       ADD PRODUCT
    ════════════════════════════════ */
    document.getElementById('btn-add-product').addEventListener('click', async () => {
      const name  = document.getElementById('product-name').value.trim();
      const desc  = document.getElementById('product-desc').value.trim();
      const price = document.getElementById('product-price').value;
      const btn   = document.getElementById('btn-add-product');

      if (!name)                                         { showToast('Product name is required.', 'error'); return; }
      if (!price || isNaN(price) || Number(price) <= 0) { showToast('Enter a valid price greater than 0.', 'error'); return; }
      if (!selectedFile)                                 { showToast('Please select a product image.', 'error'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Saving…';

      try {
        // Compress: max 500px wide, quality 0.75 → keeps base64 small enough for Realtime DB
        const imageBase64 = await compressImage(selectedFile, 500, 0.75);

        await push(ref(db, 'products'), {
          name:      name,
          desc:      desc || '',
          price:     Number(parseFloat(price).toFixed(2)),
          image:     imageBase64,
          createdAt: Date.now()
        });

        // Reset form
        document.getElementById('product-name').value  = '';
        document.getElementById('product-desc').value  = '';
        document.getElementById('product-price').value = '';
        document.getElementById('btn-remove-img').click();

        showToast('Product added successfully!', 'success');
      } catch (err) {
        console.error('Add product error:', err);
        showToast(err.message || 'Failed to add product. Try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add Product';
      }
    });

    /* ════════════════════════════════
       DELETE — event delegation
    ════════════════════════════════ */
    document.getElementById('admin-product-list').addEventListener('click', e => {
      const btn = e.target.closest('[data-delete-id]');
      if (!btn) return;
      const id = btn.dataset.deleteId;
      if (!confirm('Delete this product?')) return;
      remove(ref(db, 'products/' + id))
        .then(() => showToast('Product deleted.', 'info'))
        .catch(() => showToast('Delete failed.', 'error'));
    });

    /* ════════════════════════════════
       AUTH STATE LISTENER
    ════════════════════════════════ */
    onAuthStateChanged(auth, user => {
      const authCard = document.getElementById('auth-card');
      const mgmtCard = document.getElementById('management-card');
      if (user) {
        authCard.classList.add('hidden');
        mgmtCard.classList.remove('hidden');
        document.getElementById('user-email-display').textContent =
          user.email || user.displayName || 'Admin';
        startProductListener();
      } else {
        authCard.classList.remove('hidden');
        mgmtCard.classList.add('hidden');
      }
    });

    /* ════════════════════════════════
       PRODUCT LISTENER — shows ALL products, newest first
    ════════════════════════════════ */
    function startProductListener() {
      if (listenerStarted) return;
      listenerStarted = true;

      onValue(ref(db, 'products'), snapshot => {
        const list = document.getElementById('admin-product-list');
        list.innerHTML = '';

        if (!snapshot.exists()) {
          list.innerHTML = '<p style="color:#9e8e82;font-size:.9rem;padding:.5rem 0;">No products yet. Add your first one above!</p>';
          return;
        }

        const items = [];
        snapshot.forEach(child => items.push({ id: child.key, ...child.val() }));

        // Sort newest first (by createdAt, fall back to key order reversed)
        items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        items.forEach(p => {
          const div = document.createElement('div');
          div.className = 'admin-product-item';
          div.innerHTML =
            `<img class="admin-product-img" src="${esc(p.image)}" alt="${esc(p.name)}"
               onerror="this.src='https://placehold.co/52x52/f8f4ef/9e8e82?text=?'" />
             <div class="admin-product-info">
               <div class="admin-product-name">${esc(p.name)}</div>
               ${p.desc ? `<div class="admin-product-desc">${esc(p.desc)}</div>` : ''}
               <div class="admin-product-price">$${Number(p.price).toFixed(2)}</div>
             </div>
             <button class="btn btn-danger" data-delete-id="${p.id}">Delete</button>`;
          list.appendChild(div);
        });
      });
    }

  </script>
</body>
</html>
