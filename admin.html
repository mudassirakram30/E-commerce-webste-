<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopNest — Admin Panel</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      background: var(--warm-white);
      padding: 1.8rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      position: relative;
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(200,149,108,.05); }
    .upload-zone p { font-size:.9rem; color:var(--muted); margin:.4rem 0 0; }
    .upload-zone span { font-size:.78rem; color:var(--muted); }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0;
      cursor: pointer; width: 100%; height: 100%;
    }
    .image-preview-wrap {
      display: none; align-items: center; gap: 1rem;
      margin-top: .75rem; padding: .75rem;
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .image-preview-wrap.visible { display: flex; }
    .image-preview-wrap img { width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
    .image-preview-info { flex:1; min-width:0; }
    .image-preview-name { font-size:.88rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .image-preview-size { font-size:.78rem; color:var(--muted); }
    .btn-remove-img { background:none; border:none; cursor:pointer; color:var(--danger); padding:.3rem; border-radius:4px; }
    .btn-remove-img:hover { background:rgba(224,92,92,.1); }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-brand">Shop<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="admin.html" class="active">Admin Panel</a></li>
      </ul>
    </div>
  </nav>

  <main class="admin-wrapper">
    <h1 class="admin-title">Admin Panel</h1>
    <p class="admin-subtitle">Manage your store products and account.</p>

    <!-- AUTH CARD -->
    <div class="card" id="auth-card">
      <h2 class="card-title">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        Account Access
      </h2>

      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Login</button>
        <button class="auth-tab" id="tab-signup">Sign Up</button>
      </div>

      <div class="form-group">
        <label for="auth-email">Email Address</label>
        <input type="email" id="auth-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="btn-login">Login</button>
        <button class="btn btn-outline hidden" id="btn-signup">Create Account</button>
      </div>

      <div class="divider">or continue with</div>
      <button class="btn btn-google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <!-- MANAGEMENT CARD -->
    <div class="card hidden" id="management-card">

      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
        <div class="user-badge">
          <span class="dot"></span>
          <span id="user-email-display">user@email.com</span>
        </div>
        <button class="btn btn-outline" id="btn-logout">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </button>
      </div>

      <h2 class="card-title">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Add New Product
      </h2>

      <div class="form-group">
        <label for="product-name">Product Name</label>
        <input type="text" id="product-name" placeholder="e.g. Wireless Headphones" />
      </div>

      <div class="form-group">
        <label for="product-desc">Description</label>
        <textarea id="product-desc" placeholder="Brief description of the product…" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="product-price">Price (USD)</label>
        <input type="number" id="product-price" placeholder="29.99" min="0" step="0.01" />
      </div>

      <div class="form-group">
        <label>Product Image</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="product-image-file" accept="image/*" />
          <svg width="30" height="30" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="color:var(--muted)">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <p><strong style="color:var(--accent-dark)">Click to upload</strong> or drag &amp; drop</p>
          <span>PNG, JPG, WEBP — max 2MB</span>
        </div>

        <div class="image-preview-wrap" id="preview-wrap">
          <img id="preview-img" src="" alt="Preview" />
          <div class="image-preview-info">
            <div class="image-preview-name" id="preview-name"></div>
            <div class="image-preview-size" id="preview-size"></div>
          </div>
          <button class="btn-remove-img" id="btn-remove-img" title="Remove">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn btn-primary" id="btn-add-product">Add Product</button>

      <h2 class="card-title" style="margin-top:2rem;">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
        </svg>
        Manage Products
      </h2>
      <div id="admin-product-list">
        <p style="color:var(--muted);font-size:.9rem;">No products yet.</p>
      </div>

    </div>
  </main>

  <script type="module">

    // ── Firebase Imports ──
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getDatabase, ref, push, remove, onValue, query, limitToLast
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ── Config ──
    const app = initializeApp({
      apiKey:            "AIzaSyAY8JRgXXlO5Mutb0otOkwv7yZFTyn1t6E",
      authDomain:        "ecommerce-web-73dbf.firebaseapp.com",
      databaseURL:       "https://ecommerce-web-73dbf-default-rtdb.firebaseio.com",
      projectId:         "ecommerce-web-73dbf",
      storageBucket:     "ecommerce-web-73dbf.firebasestorage.app",
      messagingSenderId: "234407828753",
      appId:             "1:234407828753:web:365b2cc62ae9db992f00b0",
    });

    const auth     = getAuth(app);
    const db       = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let selectedFile    = null;
    let listenerStarted = false;

    // ── Toast ──
    function showToast(msg, type) {
      document.getElementById('toast') && document.getElementById('toast').remove();
      var t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast ' + (type || 'info');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 3500);
    }

    // ── Escape HTML ──
    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Friendly errors ──
    function friendlyError(code) {
      var map = {
        'auth/invalid-email':          'Invalid email address.',
        'auth/user-not-found':         'No account found with this email.',
        'auth/wrong-password':         'Incorrect password.',
        'auth/email-already-in-use':   'This email is already registered.',
        'auth/weak-password':          'Password must be at least 6 characters.',
        'auth/too-many-requests':      'Too many attempts. Please wait.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/invalid-credential':     'Invalid email or password.',
        'auth/popup-blocked':          'Popup blocked. Please allow popups for this site.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    // ── Format bytes ──
    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
      return (b/1048576).toFixed(1) + ' MB';
    }

    // ── Compress image via canvas ──
    function compressImage(file, maxWidth, quality) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onerror = reject;
        reader.onload = function(e) {
          var img = new Image();
          img.onerror = reject;
          img.onload = function() {
            var w = img.width;
            var h = img.height;
            if (w > maxWidth) {
              h = Math.round(h * maxWidth / w);
              w = maxWidth;
            }
            var canvas = document.createElement('canvas');
            canvas.width  = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ════════════════════════════
    // TAB SWITCHER
    // ════════════════════════════
    document.getElementById('tab-login').addEventListener('click', function() {
      document.getElementById('tab-login').classList.add('active');
      document.getElementById('tab-signup').classList.remove('active');
      document.getElementById('btn-login').classList.remove('hidden');
      document.getElementById('btn-signup').classList.add('hidden');
    });

    document.getElementById('tab-signup').addEventListener('click', function() {
      document.getElementById('tab-signup').classList.add('active');
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('btn-signup').classList.remove('hidden');
      document.getElementById('btn-login').classList.add('hidden');
    });

    // ════════════════════════════
    // LOGIN
    // ════════════════════════════
    document.getElementById('btn-login').addEventListener('click', function() {
      var email = document.getElementById('auth-email').value.trim();
      var pass  = document.getElementById('auth-password').value;
      if (!email || !pass) { showToast('Please enter email and password.', 'error'); return; }
      signInWithEmailAndPassword(auth, email, pass)
        .then(function() { showToast('Logged in successfully!', 'success'); })
        .catch(function(err) { showToast(friendlyError(err.code), 'error'); });
    });

    // ════════════════════════════
    // SIGN UP
    // ════════════════════════════
    document.getElementById('btn-signup').addEventListener('click', function() {
      var email = document.getElementById('auth-email').value.trim();
      var pass  = document.getElementById('auth-password').value;
      if (!email || !pass) { showToast('Please enter email and password.', 'error'); return; }
      if (pass.length < 6) { showToast('Password must be at least 6 characters.', 'error'); return; }
      createUserWithEmailAndPassword(auth, email, pass)
        .then(function() { showToast('Account created! You are now logged in.', 'success'); })
        .catch(function(err) { showToast(friendlyError(err.code), 'error'); });
    });

    // ════════════════════════════
    // GOOGLE LOGIN
    // ════════════════════════════
    document.getElementById('btn-google').addEventListener('click', function() {
      signInWithPopup(auth, provider)
        .then(function() { showToast('Signed in with Google!', 'success'); })
        .catch(function(err) {
          if (err.code !== 'auth/popup-closed-by-user') {
            showToast(friendlyError(err.code), 'error');
          }
        });
    });

    // ════════════════════════════
    // LOGOUT
    // ════════════════════════════
    document.getElementById('btn-logout').addEventListener('click', function() {
      signOut(auth)
        .then(function() { showToast('Logged out.', 'info'); })
        .catch(function() { showToast('Logout failed.', 'error'); });
    });

    // ════════════════════════════
    // FILE SELECT & PREVIEW
    // ════════════════════════════
    var fileInput   = document.getElementById('product-image-file');
    var uploadZone  = document.getElementById('upload-zone');
    var previewWrap = document.getElementById('preview-wrap');
    var previewImg  = document.getElementById('preview-img');
    var previewName = document.getElementById('preview-name');
    var previewSize = document.getElementById('preview-size');

    fileInput.addEventListener('change', function() {
      if (fileInput.files[0]) handleFileSelect(fileInput.files[0]);
    });

    uploadZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      uploadZone.style.borderColor = 'var(--accent)';
    });
    uploadZone.addEventListener('dragleave', function() {
      uploadZone.style.borderColor = '';
    });
    uploadZone.addEventListener('drop', function(e) {
      e.preventDefault();
      uploadZone.style.borderColor = '';
      if (e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
    });

    function handleFileSelect(file) {
      if (!file.type.startsWith('image/')) {
        showToast('Please select an image file.', 'error'); return;
      }
      if (file.size > 2 * 1024 * 1024) {
        showToast('Image must be under 2MB.', 'error'); return;
      }
      selectedFile = file;
      var reader = new FileReader();
      reader.onload = function(e) {
        previewImg.src = e.target.result;
        previewName.textContent = file.name;
        previewSize.textContent = formatBytes(file.size);
        previewWrap.classList.add('visible');
        uploadZone.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('btn-remove-img').addEventListener('click', function() {
      selectedFile = null;
      previewImg.src = '';
      previewWrap.classList.remove('visible');
      uploadZone.style.display = '';
      fileInput.value = '';
    });

    // ════════════════════════════
    // ADD PRODUCT
    // ════════════════════════════
    document.getElementById('btn-add-product').addEventListener('click', function() {
      var name  = document.getElementById('product-name').value.trim();
      var desc  = document.getElementById('product-desc').value.trim();
      var price = document.getElementById('product-price').value;
      var btn   = document.getElementById('btn-add-product');

      if (!name)                                         { showToast('Product name is required.', 'error'); return; }
      if (!price || isNaN(price) || Number(price) <= 0) { showToast('Enter a valid price.', 'error'); return; }
      if (!selectedFile)                                 { showToast('Please select a product image.', 'error'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Saving…';

      compressImage(selectedFile, 400, 0.7)
        .then(function(imageBase64) {
          return push(ref(db, 'products'), {
            name:  name,
            desc:  desc || '',
            price: Number(price),
            image: imageBase64,
          });
        })
        .then(function() {
          document.getElementById('product-name').value  = '';
          document.getElementById('product-desc').value  = '';
          document.getElementById('product-price').value = '';
          document.getElementById('btn-remove-img').click();
          showToast('Product added successfully!', 'success');
        })
        .catch(function(err) {
          showToast(err.message || 'Failed. Try again.', 'error');
        })
        .finally(function() {
          btn.disabled = false;
          btn.textContent = 'Add Product';
        });
    });

    // ════════════════════════════
    // DELETE (event delegation)
    // ════════════════════════════
    document.getElementById('admin-product-list').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-delete-id]');
      if (!btn) return;
      remove(ref(db, 'products/' + btn.dataset.deleteId))
        .then(function()  { showToast('Product deleted.', 'info'); })
        .catch(function() { showToast('Delete failed.', 'error'); });
    });

    // ════════════════════════════
    // AUTH STATE
    // ════════════════════════════
    onAuthStateChanged(auth, function(user) {
      var authCard = document.getElementById('auth-card');
      var mgmtCard = document.getElementById('management-card');
      if (user) {
        authCard.classList.add('hidden');
        mgmtCard.classList.remove('hidden');
        document.getElementById('user-email-display').textContent =
          user.email || user.displayName || 'Admin';
        startProductListener();
      } else {
        authCard.classList.remove('hidden');
        mgmtCard.classList.add('hidden');
      }
    });

    // ════════════════════════════
    // PRODUCT LISTENER
    // ════════════════════════════
    function startProductListener() {
      if (listenerStarted) return;
      listenerStarted = true;

      var q = query(ref(db, 'products'), limitToLast(10));
      onValue(q, function(snapshot) {
        var list = document.getElementById('admin-product-list');
        list.innerHTML = '';

        if (!snapshot.exists()) {
          list.innerHTML = '<p style="color:var(--muted);font-size:.9rem;padding:.5rem 0;">No products yet. Add your first one above!</p>';
          return;
        }

        var items = [];
        snapshot.forEach(function(child) {
          items.push(Object.assign({ id: child.key }, child.val()));
        });
        items.reverse();

        items.forEach(function(p) {
          var div = document.createElement('div');
          div.className = 'admin-product-item';
          div.innerHTML =
            '<img class="admin-product-img" src="' + esc(p.image) + '" alt="' + esc(p.name) + '" onerror="this.src=\'https://placehold.co/52x52/f8f4ef/9e8e82?text=?\'" />' +
            '<div class="admin-product-info">' +
              '<div class="admin-product-name">' + esc(p.name) + '</div>' +
              (p.desc ? '<div class="admin-product-desc">' + esc(p.desc) + '</div>' : '') +
              '<div class="admin-product-price">$' + Number(p.price).toFixed(2) + '</div>' +
            '</div>' +
            '<button class="btn btn-danger" data-delete-id="' + p.id + '">Delete</button>';
          list.appendChild(div);
        });
      });
    }

  </script>
</body>
</html>
