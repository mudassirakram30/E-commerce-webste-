<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopNest — Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══ NAVBAR ══ -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-brand">Shop<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="admin.html">Admin Panel</a></li>
      </ul>
    </div>
  </nav>

  <!-- ══ HERO ══ -->
  <section class="hero">
    <div class="hero-content">
      <h1>Discover Our Collection</h1>
      <p>Curated products updated in real-time — fresh finds every day.</p>
    </div>
  </section>

  <!-- ══ PRODUCT SECTION ══ -->
  <main class="section">
    <h2 class="section-title">All Products</h2>
    <p class="section-subtitle">Browsing our full catalogue</p>

    <!-- Product Grid — populated by Firebase listener -->
    <div class="product-grid" id="product-grid">
      <!-- Loading placeholder -->
      <div class="empty-state" id="loading-state">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m5-9v9m4-9v9m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3"/>
        </svg>
        <p>Loading products…</p>
      </div>
    </div>
  </main>

  <!-- ══ FIREBASE MODULE IMPORT ══ -->
  <script type="module">
    import { listenToProducts } from './app.js';

    const grid         = document.getElementById('product-grid');
    const loadingState = document.getElementById('loading-state');

    /**
     * Renders the product grid from the products array.
     * Called automatically whenever Firebase data changes.
     */
    listenToProducts((products) => {
      // Clear everything except the loading placeholder structure
      grid.innerHTML = '';

      if (products.length === 0) {
        // Empty state — no products yet
        grid.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/>
            </svg>
            <p>No products yet. Check back soon!</p>
          </div>
        `;
        return;
      }

      // Render each product card
      products.forEach((product) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img
            src="${escapeHtml(product.image)}"
            alt="${escapeHtml(product.name)}"
            onerror="this.src='https://placehold.co/400x300/f8f4ef/9e8e82?text=No+Image'"
          />
          <div class="product-card-body">
            <p class="product-card-name" title="${escapeHtml(product.name)}">
              ${escapeHtml(product.name)}
            </p>
            ${product.desc ? `<p class="product-card-desc">${escapeHtml(product.desc)}</p>` : ''}
            <p class="product-card-price">$${Number(product.price).toFixed(2)}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    });

    /** Simple HTML escape to prevent XSS */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>

</body>
</html>
